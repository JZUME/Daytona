# Keeps the GitHub Actions in .github/workflows up to date. The submodules
# are left alone: labwc is pinned to the version Debian 13 ships, and a
# Chicago95 update is its own reviewed change (AGENT.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: CI
