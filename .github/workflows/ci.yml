# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# Changes that can't affect the build, tests or packages don't run CI.
# Markdown docs (README.md, docs/) are packaged, but a docs-only change
# waits for the next real build rather than costing a full run. Path
# filters don't apply to tag pushes, so releases always build.
# debian/changelog (the package version) is not ignored. Keep both
# lists the same.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.devcontainer/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.devcontainer/**'

# A newer push to the same pull request or branch cancels the older run.
# Release tags are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and test (Debian 13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:trixie
    steps:
      # git must be present before checkout, otherwise actions/checkout falls
      # back to downloading an archive without submodules.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates \
            build-essential cmake ninja-build pkgconf qt6-base-dev \
            liblayershellqtinterface-dev libwayland-dev libwayland-bin \
            qt6-wayland-dev qt6-wayland-dev-tools \
            labwc grim wlr-randr wlrctl qt6-wayland qt6-svg-plugins dbus dex libglib2.0-bin \
            meson libwlroots-0.18-dev wayland-protocols libxkbcommon-dev libxcb1-dev libxcb-icccm4-dev libxcb-composite0-dev libxcb-damage0-dev libdrm-dev libxml2-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libinput-dev libpixman-1-dev libpng-dev librsvg2-dev libsfdo-dev \
            libpulse-dev libcanberra-dev libpam0g-dev qt6-base-private-dev qt6-wayland-private-dev swayidle wl-clipboard xwayland

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DDAYTONA_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  package:
    name: Debian packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    container: debian:trixie
    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates \
            dpkg-dev debhelper fakeroot lintian

      - uses: actions/checkout@v4
        with:
          submodules: true
          path: daytona

      - name: Install build dependencies
        run: apt-get build-dep -y ./daytona

      # Releases (vX.Y.Z tags) keep the version in debian/changelog, which
      # must match the tag (scripts/release.sh); other builds get a
      # snapshot version.
      - name: Check the release version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: daytona
        run: |
          version="$(dpkg-parsechangelog -S Version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "debian/changelog has $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Snapshot version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: daytona
        run: |
          git config --global --add safe.directory "$PWD"
          scripts/snapshot-version.sh

      - name: Build
        working-directory: daytona
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: lintian --fail-on error --info daytona_*.deb daytona-chicago95_*.deb daytona-greeter_*.deb

      # The debug symbols go with the packages (and so into the apt
      # repository), for readable backtraces of the shell and labwc.
      - name: Collect
        run: mkdir dist && mv daytona_*.deb daytona-chicago95_*.deb daytona-greeter_*.deb daytona-dbgsym_*.deb daytona-greeter-dbgsym_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Packages (${{ matrix.arch }})
          path: dist/*.deb

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates clang-format

      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror
