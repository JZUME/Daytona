# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# Changes that can't affect the build, tests or packages don't run CI.
# Markdown docs (README.md, docs/) are packaged, but a docs-only change
# waits for the next real build rather than costing a full run. Path
# filters don't apply to tag pushes, so releases always build.
# debian/changelog (the package version) is not ignored. Keep both
# lists the same.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.devcontainer/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.devcontainer/**'

# A newer push to the same pull request or branch cancels the older run.
# Release tags are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    name: Debian packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    container: debian:trixie
    steps:
      # git must be present before checkout, otherwise actions/checkout falls
      # back to downloading an archive without submodules.
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates \
            dpkg-dev debhelper fakeroot lintian

      # amd64 also runs the smoke tests, against the packages it builds, so
      # the code is compiled once per architecture. The tools must be there
      # before the build configures, or the smoke tests are left out.
      - name: Install smoke test tools
        if: matrix.arch == 'amd64'
        run: |
          apt-get install -y --no-install-recommends \
            labwc grim wlr-randr wlrctl qt6-wayland qt6-svg-plugins dbus dex \
            libglib2.0-bin swayidle wl-clipboard xwayland

      - uses: actions/checkout@v7
        with:
          submodules: true
          path: daytona

      - name: Install build dependencies
        run: apt-get build-dep -y ./daytona

      # Releases (vX.Y.Z tags) keep the version in debian/changelog, which
      # must match the tag (scripts/release.sh); other builds get a
      # snapshot version.
      - name: Check the release version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: daytona
        run: |
          version="$(dpkg-parsechangelog -S Version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "debian/changelog has $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Snapshot version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: daytona
        run: |
          git config --global --add safe.directory "$PWD"
          scripts/snapshot-version.sh

      # amd64 treats compiler warnings as errors and points the smoke tests
      # at the installed packages.
      - name: Build
        working-directory: daytona
        env:
          DAYTONA_CMAKE_ARGS: ${{ matrix.arch == 'amd64' && '-DDAYTONA_WERROR=ON -DDAYTONA_SMOKE_PREFIX=/usr' || '' }}
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: lintian --fail-on error --info daytona_*.deb daytona-chicago95_*.deb daytona-greeter_*.deb

      - name: Smoke tests
        if: matrix.arch == 'amd64'
        run: |
          apt-get install -y --no-install-recommends \
            ./daytona_*.deb ./daytona-chicago95_*.deb
          ctest --test-dir daytona/obj-x86_64-linux-gnu -L smoke --output-on-failure

      # The debug symbols go with the packages (and so into the apt
      # repository), for readable backtraces of the shell and labwc.
      - name: Collect
        run: mkdir dist && mv daytona_*.deb daytona-chicago95_*.deb daytona-greeter_*.deb daytona-dbgsym_*.deb daytona-greeter-dbgsym_*.deb dist/

      - uses: actions/upload-artifact@v7
        with:
          name: Packages (${{ matrix.arch }})
          path: dist/*.deb

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates clang-format

      - uses: actions/checkout@v7

      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror
