name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test (Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      # git must be present before checkout, otherwise actions/checkout falls
      # back to downloading an archive without submodules.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates \
            build-essential cmake ninja-build pkgconf qt6-base-dev \
            liblayershellqtinterface-dev libwayland-dev libwayland-bin \
            qt6-wayland-dev qt6-wayland-dev-tools \
            labwc grim wlr-randr qt6-wayland qt6-svg-plugins dbus

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DDAYTONA_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  package:
    name: Debian packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates \
            dpkg-dev debhelper fakeroot lintian

      - uses: actions/checkout@v4
        with:
          submodules: true
          path: daytona

      - name: Install build dependencies
        run: apt-get build-dep -y ./daytona

      - name: Build
        working-directory: daytona
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: lintian --fail-on error --info daytona_*.deb daytona-chicago95_*.deb

      - name: Collect
        run: mkdir dist && mv daytona_*.deb daytona-chicago95_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Packages (${{ matrix.arch }})
          path: dist/*.deb

  format:
    name: clang-format
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates clang-format

      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror
