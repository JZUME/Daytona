# Which xdg-desktop-portal backends serve the Daytona session
# (XDG_CURRENT_DESKTOP=Daytona). See docs/third-party-apps.md.
#
# Screen sharing and screenshots: xdg-desktop-portal-wlr, which captures
# labwc's screens, with Daytona's Share Screen dialog as its chooser.
# File Open and Save dialogs: xdg-desktop-portal-lxqt, a Qt dialog that takes
# the daytona style and has NT's layout (Look in, the file list, File name
# and Files of type); xdg-desktop-portal-gtk's if LXQt's is not installed.
# Everything else (Open With, printing, appearance settings):
# xdg-desktop-portal-gtk, whose dialogs are GTK 3 in the Daytona theme.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=lxqt;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
